# ============================================================
# Linux 漏洞发现 Skill — 可选运行配置
# ============================================================
# 本文件为可选配置覆盖文件：
#   - 文件存在时：Skill 启动时读取，覆盖 SKILL.md 中对应默认值
#   - 文件不存在时：Skill 使用内置默认值正常运行，无任何影响
# ============================================================

# 运行模式（三选一）：
#   kali       — 在 Kali 主机上运行，直接调用工具链（默认）
#   ssh_remote — 通过 SSH 连接远程 Kali 跳板机执行工具链命令
#   generic    — 纯通用模式，仅使用目标机自带工具
# KALI_MODE: "kali"

# ------------------------------------------------------------
# 远程 Kali 跳板机配置（仅 KALI_MODE: "ssh_remote" 时生效）
# ------------------------------------------------------------
# REMOTE_KALI:
#   host: "192.168.1.100"           # Kali 跳板机 IP 地址
#   port: 22                        # SSH 端口
#   user: "kali"                    # SSH 用户名
#   auth_method: "password"         # 认证方式: password | key
#   password: ""                    # password 方式时填写密码
#   key_path: "~/.ssh/id_rsa"       # key 方式时填写私钥路径
#   ssh_options: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"